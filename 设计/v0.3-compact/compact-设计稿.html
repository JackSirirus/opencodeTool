<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>opencodeTool · 紧凑模式 设计稿 v0.3</title>
<style>
  /* ============================================================
   * tokens: 与 src/widget/styles.css 完全一致
   * ============================================================ */
  :root {
    --bg-0:#0a0d12; --bg-1:#0f141b; --bg-2:#161d27; --bg-3:#1d2532;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16); --border-soft:rgba(255,255,255,0.04);
    --fg:rgba(255,255,255,0.94); --fg-2:rgba(255,255,255,0.62); --fg-3:rgba(255,255,255,0.38); --fg-4:rgba(255,255,255,0.22);
    --amber:#f5b942; --amber-soft:rgba(245,185,66,0.18); --amber-glow:rgba(245,185,66,0.35);
    --coral:#ff8a3d; --cyan:#7ed3ff; --cyan-soft:rgba(126,211,255,0.16);
    --violet:#c4b5fd; --violet-soft:rgba(196,181,253,0.16);
    --danger:#ff6b6b; --danger-soft:rgba(255,107,107,0.16); --warn:#fbbf24;
    --mono:"Cascadia Mono","JetBrains Mono","Cascadia Code","Consolas","SFMono-Regular",ui-monospace,monospace;
    --ui:"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:#0b0e13;
    background-image:
      radial-gradient(1100px 560px at 84% -8%, rgba(245,185,66,0.05), transparent),
      radial-gradient(900px 480px at 4% 108%, rgba(126,211,255,0.04), transparent);
    background-attachment:fixed;
    color:var(--fg); font-family:var(--ui); font-size:13px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  /* ============================================================
   * page chrome (仅设计稿页面用，不属于窗口)
   * ============================================================ */
  .page { max-width:1160px; margin:0 auto; padding:48px 28px 96px; }
  .ptop { margin-bottom:8px; }
  .ptop__row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ptop h1 { font-size:22px; margin:0; letter-spacing:-0.01em; font-weight:650; }
  .vpill { font-family:var(--mono); font-size:11px; color:var(--amber);
           background:var(--amber-soft); border:1px solid rgba(245,185,66,0.28);
           padding:2px 9px; border-radius:999px; }
  .datepill { font-family:var(--mono); font-size:11px; color:var(--fg-3);
              border:1px solid var(--border); padding:2px 9px; border-radius:999px; }
  .ptop__meta { color:var(--fg-3); font-size:12px; margin:10px 0 0; }
  .ptop__meta code { font-family:var(--mono); color:var(--fg-2); font-size:11.5px; }
  .ptop__note { color:var(--fg-2); font-size:12.5px; line-height:1.75;
                margin:14px 0 0; padding:12px 16px;
                border-left:2px solid rgba(245,185,66,0.42);
                background:rgba(245,185,66,0.035);
                border-radius:0 var(--r-sm) var(--r-sm) 0; }
  .ptop__note b { color:var(--fg); }

  /* ============================================================
   * gallery of mockups
   * ============================================================ */
  .gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
             gap:60px 64px; margin-top:46px; }
  .shot { display:flex; flex-direction:column; min-width:0; }
  .shot__head { display:flex; align-items:center; justify-content:space-between;
                gap:10px; padding-bottom:9px; border-bottom:1px solid var(--border-soft);
                margin-bottom:30px; }
  .shot__title { font-size:14px; font-weight:650; color:var(--fg); }
  .size { font-family:var(--mono); font-size:11px; color:var(--fg-3); letter-spacing:0.02em; }
  .size--compact { color:var(--violet); }

  .mock { position:relative; width:300px; padding-top:34px; }
  .pin { position:absolute; top:0; display:inline-flex; align-items:center; gap:5px;
         padding:3px 9px; border-radius:999px; font-size:11px; line-height:1.4;
         white-space:nowrap; background:rgba(245,185,66,0.14);
         border:1px solid rgba(245,185,66,0.5); color:var(--amber);
         box-shadow:0 0 0 3px rgba(245,185,66,0.06); font-family:var(--ui); }
  .pin::after { content:""; position:absolute; left:50%; bottom:-5px;
                width:8px; height:8px; transform:translateX(-50%) rotate(45deg);
                background:rgba(245,185,66,0.14);
                border-right:1px solid rgba(245,185,66,0.5);
                border-bottom:1px solid rgba(245,185,66,0.5); }
  .pin--btn   { right:77px; transform:translateX(50%); }
  .pin--btn-c { right:75px; transform:translateX(50%); }
  .pin--gray  { background:rgba(255,255,255,0.05); border-color:var(--border-strong);
                color:var(--fg-2); box-shadow:none; }
  .pin--gray::after { background:rgba(255,255,255,0.05); border-color:var(--border-strong); }
  .pin .k { font-family:var(--mono); color:var(--fg); }

  .notes { font-size:12.5px; color:var(--fg-2); line-height:1.7; margin:18px 0 0; padding:0; }
  .notes ul { margin:0; padding-left:18px; }
  .notes li { margin:6px 0; }
  .notes .k { font-family:var(--mono); color:var(--amber); font-size:11.5px; }
  .notes .kc { font-family:var(--mono); color:var(--cyan); font-size:11.5px; }
  .notes .kv { font-family:var(--mono); color:var(--violet); font-size:11.5px; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px;
         background:var(--amber-soft); color:var(--amber); margin-right:6px; vertical-align:1px; }
  .tag.c { background:var(--cyan-soft); color:var(--cyan); }
  .tag.v { background:var(--violet-soft); color:var(--violet); }

  /* ============================================================
   * WIDGET — 1:1 复刻 src/widget/styles.css
   * ============================================================ */
  .widget { position:relative; width:300px; padding:4px; user-select:none; }
  .widget--full { height:400px; }
  .widget--compact { height:120px; }

  .widget .card {
    position:relative; width:100%; height:100%; display:flex; flex-direction:column;
    border-radius:var(--r-lg);
    background:
      radial-gradient(140% 90% at 100% 0%, rgba(245,185,66,0.06), transparent 55%),
      radial-gradient(120% 80% at 0% 100%, rgba(126,211,255,0.05), transparent 60%),
      linear-gradient(160deg,#161d27 0%,#0f141b 60%,#0a0d12 100%);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 10px 30px rgba(0,0,0,0.45);
    overflow:hidden;
  }
  .widget .card::before {
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:repeating-linear-gradient(0deg,
      rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay; opacity:0.6;
  }

  /* ---- header ---- */
  .c-head { display:flex; align-items:center; justify-content:space-between; gap:6px;
            padding:8px 8px 8px 12px; border-bottom:1px solid var(--border-soft);
            flex:0 0 auto; position:relative; z-index:1; }
  .c-head--compact { padding:7px 8px 7px 12px; gap:8px; }
  .brand { display:flex; align-items:center; gap:6px; font-weight:500;
           letter-spacing:0.02em; min-width:0; }
  .c-head--compact .brand { gap:6px; }
  .brand__dot { width:8px; height:8px; border-radius:50%; background:var(--amber);
                box-shadow:0 0 0 3px var(--amber-soft), 0 0 8px var(--amber-glow);
                animation:pulse 2.4s ease-in-out infinite; flex:0 0 auto; }
  .c-head--compact .brand__dot { width:7px; height:7px; }
  .brand__dot.is-gray { background:var(--fg-4); box-shadow:none; animation:none; }
  .brand__dot.is-red  { background:var(--danger); box-shadow:0 0 8px rgba(255,107,107,0.4); animation:none; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 3px var(--amber-soft), 0 0 8px var(--amber-glow); }
    50%     { box-shadow:0 0 0 5px rgba(245,185,66,0.08), 0 0 12px var(--amber-glow); }
  }
  .brand__title { font-size:12px; color:var(--fg); font-weight:600; white-space:nowrap; }
  .brand__sub { font-size:11px; color:var(--fg-3); font-weight:400;
                letter-spacing:0.18em; text-transform:uppercase; white-space:nowrap; }
  .c-tag { display:none; }

  .tabs { display:flex; align-items:center; background:#0a0d12; border:1px solid var(--border-soft);
          border-radius:999px; padding:2px; flex:0 0 auto; }
  .tab { appearance:none; border:none; background:transparent; font-family:var(--ui);
         font-size:10px; line-height:1; padding:3px 9px; border-radius:999px;
         color:var(--fg-3); cursor:pointer; transition:background 120ms ease,color 120ms ease; }
  .tab:hover { color:var(--fg-2); }
  .tab.on { background:var(--amber-soft); color:var(--amber); font-weight:600; }
  .c-head--compact .tab { padding:3px 8px; }

  .actions { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .iconbtn { appearance:none; border:1px solid var(--border); background:rgba(255,255,255,0.02);
             color:var(--fg-2); width:22px; height:22px; border-radius:var(--r-sm);
             display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
             transition:background 120ms ease,border-color 120ms ease,color 120ms ease,transform 120ms ease; }
  .iconbtn:hover { background:rgba(255,255,255,0.06); border-color:var(--border-strong); color:var(--fg); }
  .iconbtn:active { transform:scale(0.94); }
  .iconbtn svg { width:12px; height:12px; fill:currentColor; }
  .iconbtn--stroke svg { fill:none; stroke:currentColor; stroke-width:1.6;
                         stroke-linecap:round; stroke-linejoin:round; }
  .iconbtn--danger:hover { background:var(--danger-soft); border-color:rgba(255,107,107,0.32); color:var(--danger); }
  .iconbtn--rotate svg { transition:transform 400ms ease; }
  .iconbtn--new { border-color:rgba(245,185,66,0.5); color:var(--amber);
                  box-shadow:0 0 0 3px rgba(245,185,66,0.08); }

  /* ---- panes ---- */
  .pane { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }

  /* ---- hero ---- */
  .hero { padding:10px 14px 8px; border-bottom:1px solid var(--border-soft); flex:0 0 auto; }
  .pane--go .hero { padding:4px 14px 6px; }
  .pane--go .hero__cost { margin-bottom:4px; }
  .hero__row { display:flex; align-items:baseline; justify-content:space-between; }
  .hero__label { font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
                 color:var(--fg-3); font-weight:500; }
  .hero__hint { font-family:var(--mono); font-size:10px; color:var(--fg-4); }
  .hero__cost { display:flex; align-items:baseline; margin-top:2px; margin-bottom:6px;
                font-family:var(--mono); line-height:1; }
  .hero__currency { font-size:15px; color:var(--amber); margin-right:2px; font-weight:500;
                    opacity:0.9; transform:translateY(-2px); }
  .hero__amount { font-size:28px; font-weight:600; color:var(--amber);
                  letter-spacing:-0.02em; text-shadow:0 0 18px rgba(245,185,66,0.28); }
  .hero__unit { font-size:13px; color:var(--fg-3); font-weight:400; margin-left:4px; }
  .hero__sub { display:flex; flex-wrap:wrap; gap:6px; }
  .go-hero-sub { display:block; font-family:var(--mono); font-size:11px; color:var(--fg-3); }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 7px 3px 8px;
          border-radius:999px; background:rgba(255,255,255,0.03); border:1px solid var(--border);
          font-size:11px; color:var(--fg-2); }
  .chip__k { color:var(--fg-3); letter-spacing:0.06em; }
  .chip__v { font-family:var(--mono); color:var(--fg); font-weight:500; }
  .chip--alt { background:var(--cyan-soft); border-color:rgba(126,211,255,0.18); }
  .chip--ghost { background:transparent; border-color:var(--border); }

  /* ---- week / all-time rows ---- */
  .rows { padding:6px 14px; display:flex; flex-direction:column; gap:2px;
          border-bottom:1px solid var(--border-soft); flex:0 0 auto; }
  .row { display:grid; grid-template-columns:36px 1fr auto; align-items:baseline; gap:8px; padding:2px 0; }
  .row__label { font-size:11px; color:var(--fg-3); letter-spacing:0.14em; }
  .row__cost { font-family:var(--mono); font-size:14px; color:var(--fg); font-weight:500; letter-spacing:-0.01em; }
  .row--strong .row__cost { font-size:15px; color:var(--amber); }
  .row__meta { font-family:var(--mono); font-size:10px; color:var(--fg-3); }

  /* ---- chart ---- */
  .chart { padding:8px 14px 16px; border-bottom:1px solid var(--border-soft); flex:0 0 auto; }
  .chart__head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .chart__title { font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--fg-3); font-weight:500; }
  .chart__hint { font-family:var(--mono); font-size:10px; color:var(--fg-3); }
  .chart__body { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; align-items:end; height:44px; }
  .bar { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
         height:100%; border-radius:3px; background:linear-gradient(180deg,var(--amber) 0%,var(--coral) 100%);
         min-height:2px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.04); }
  .bar--today::after { content:""; position:absolute; inset:-3px -2px auto -2px; height:3px;
                       border-radius:3px; background:var(--amber); box-shadow:0 0 6px var(--amber-glow); }
  .bar__day { position:absolute; bottom:-14px; font-family:var(--mono); font-size:9px; color:var(--fg-3); }
  .bar--today .bar__day { color:var(--amber); }

  /* ---- fee lists ---- */
  .lists { padding:10px 10px 8px; display:grid; grid-template-columns:1fr 1fr; gap:6px;
           flex:1 1 auto; min-height:0; }
  .list { display:flex; flex-direction:column; min-height:0; background:rgba(255,255,255,0.015);
          border:1px solid var(--border-soft); border-radius:var(--r-md); padding:6px 7px 5px; }
  .list__head { display:flex; align-items:baseline; justify-content:space-between;
                padding:0 1px 4px; border-bottom:1px dashed var(--border-soft); }
  .list__title { font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
                 color:var(--cyan); font-weight:500; }
  .list:nth-child(2) .list__title { color:var(--violet); }
  .list__hint { font-family:var(--mono); font-size:9px; color:var(--fg-4); letter-spacing:0.04em; }
  .list__items { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .list__item { display:grid; grid-template-columns:12px 1fr auto; align-items:center; gap:5px;
                padding:2px; border-radius:4px; font-size:11px; color:var(--fg-2); }
  .list__idx { font-family:var(--mono); font-size:9px; color:var(--fg-4); text-align:right; }
  .list__name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--fg); }
  .list__cost { font-family:var(--mono); font-size:10px; color:var(--fg-2); }

  /* ---- Go: quota ---- */
  .go-quota { padding:4px 14px 6px; flex:0 0 auto; }
  .go-quota__head { display:flex; align-items:baseline; justify-content:space-between;
                    font-size:10px; color:var(--fg-3); letter-spacing:0.14em; margin-bottom:4px; }
  .go-quota__src { font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--violet); }
  .go-qrow { display:grid; grid-template-columns:40px 1fr 36px 62px; align-items:center;
             gap:7px; margin-bottom:4px; }
  .go-qrow:last-child { margin-bottom:0; }
  .go-qrow__n { font-size:10px; color:var(--fg-2); white-space:nowrap; }
  .go-qrow__bar { position:relative; height:4px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .go-qrow__fill { display:block; height:100%; border-radius:999px;
                   background:linear-gradient(90deg,var(--violet),#9f8cfa); }
  .go-qrow.warn .go-qrow__fill { background:linear-gradient(90deg,var(--warn),var(--coral)); }
  .go-qrow.hit  .go-qrow__fill { background:linear-gradient(90deg,var(--danger),#e04848); }
  .go-qrow__v { font-family:var(--mono); font-size:10.5px; color:var(--violet); text-align:right; }
  .go-qrow.warn .go-qrow__v { color:var(--warn); }
  .go-qrow.hit  .go-qrow__v { color:var(--danger); }
  .go-qrow__r { font-family:var(--mono); font-size:9px; color:var(--fg-4); text-align:right; white-space:nowrap; }

  /* ---- Go: hit rate ---- */
  .go-hits { display:flex; flex-direction:column; gap:5px; padding:4px 14px 6px;
             border-top:1px solid var(--border-soft); flex:0 0 auto; }
  .go-hit { display:grid; grid-template-columns:92px 1fr 52px; align-items:center; gap:8px; }
  .go-hit__n { font-size:10px; color:var(--fg-3); white-space:nowrap; }
  .go-hit__bar { height:4px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .go-hit__fill { display:block; height:100%; border-radius:999px; }
  .go-hit__v { font-family:var(--mono); font-size:11px; text-align:right; }
  .go-hit.a .go-hit__fill { background:linear-gradient(90deg,var(--amber),var(--coral)); }
  .go-hit.a .go-hit__v { color:var(--amber); }
  .go-hit.c .go-hit__fill { background:linear-gradient(90deg,var(--cyan),#4aa8d8); }
  .go-hit.c .go-hit__v { color:var(--cyan); }

  /* ---- Go: week / all-time ---- */
  .go-rows { display:flex; flex-direction:column; padding:3px 14px 5px;
             border-top:1px solid var(--border-soft); flex:0 0 auto; }
  .go-row { display:flex; align-items:baseline; gap:8px; padding:2px 0; }
  .go-row__lbl { font-size:11px; color:var(--fg-3); letter-spacing:0.14em; }
  .go-row__req { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--fg); }
  .go-row__req small { font-size:10px; color:var(--fg-4); font-weight:400; margin-left:2px; }
  .go-row__meta { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--fg-3); }
  .go-row--strong { border-top:1px dashed var(--border-soft); }

  /* ---- Go: model list ---- */
  .go-lists { display:flex; flex-direction:column; padding:4px 14px 3px;
              border-top:1px solid var(--border-soft); flex:1 1 auto; min-height:0; overflow:hidden; }
  .go-list__head { display:flex; align-items:baseline; justify-content:space-between;
                   font-size:10px; color:var(--fg-3); letter-spacing:0.06em; }
  .go-list__items { list-style:none; margin:3px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .go-list__item { display:flex; align-items:center; gap:7px; font-size:11px; line-height:1.25;
                   padding:1px 6px; border-radius:var(--r-sm); background:rgba(255,255,255,0.025);
                   border:1px solid var(--border-soft); }
  .go-list__idx { font-family:var(--mono); font-size:9px; color:var(--fg-4); }
  .go-list__nm { font-family:var(--mono); font-size:10px; color:var(--fg-2); overflow:hidden;
                 white-space:nowrap; text-overflow:ellipsis; }
  .go-list__rq { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--cyan); }
  .go-list__co { font-family:var(--mono); font-size:10px; color:var(--amber); width:48px; text-align:right; }
  .go-foot { display:flex; justify-content:space-between; margin-top:auto; padding:3px 14px 4px;
             font-family:var(--mono); font-size:9.5px; color:var(--fg-4); flex:0 0 auto; }

  /* ---- COMPACT (layout A) ---- */
  .c-fee-rows { flex:1 1 auto; display:flex; flex-direction:column; min-height:0;
                padding:5px 14px 6px; }
  .c-fee-row { flex:1 1 0; display:flex; align-items:center; justify-content:space-between;
               gap:8px; min-height:0; }
  .c-fee-row__k { font-size:11px; color:var(--fg-3); letter-spacing:0.14em; }
  .c-fee-row__v { font-family:var(--mono); font-feature-settings:"tnum" 1;
                  font-size:14px; color:var(--fg); font-weight:500; letter-spacing:-0.01em; }
  .c-fee-row--strong .c-fee-row__v { color:var(--amber); font-size:15px; }

  .c-go-rows { flex:1 1 auto; display:flex; flex-direction:column; min-height:0;
               padding:5px 14px 6px; }
  .c-go-row { flex:1 1 0; display:grid; grid-template-columns:34px 1fr 40px 64px;
              gap:6px; align-items:center; min-height:0; }
  .c-go-row__n { font-size:10px; color:var(--fg-2); white-space:nowrap; }
  .c-go-row__bar { position:relative; height:4px; border-radius:999px;
                   background:rgba(255,255,255,0.06); overflow:hidden; }
  .c-go-row__fill { display:block; height:100%; border-radius:999px; width:0;
                    background:linear-gradient(90deg,var(--violet),#9f8cfa); }
  .c-go-row__v { font-family:var(--mono); font-feature-settings:"tnum" 1; font-size:10.5px;
                 color:var(--violet); text-align:right; }
  .c-go-row__r { font-family:var(--mono); font-size:9px; color:var(--fg-4);
                 text-align:right; white-space:nowrap; }
